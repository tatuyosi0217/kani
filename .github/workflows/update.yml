name: ニュース更新・公開

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分 (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "newsdesk/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions: {}

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 依存パッケージをインストール
        run: python -m pip install -r requirements.txt

      # 記事・翻訳キャッシュを前回の実行から引き継ぐ(リポジトリには保存しない)
      - name: 前回の状態を復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: newsdesk-state-${{ github.run_id }}
          restore-keys: newsdesk-state-

      - name: 前回の市場データを復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/data/markets.json
          key: newsdesk-markets-${{ github.run_id }}
          restore-keys: newsdesk-markets-

      - name: ニュース収集・翻訳
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TRANSLATOR: ${{ vars.TRANSLATOR || 'auto' }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          TRANSLATE_EFFORT: ${{ vars.TRANSLATE_EFFORT }}
          MAX_TRANSLATE_PER_RUN: ${{ vars.MAX_TRANSLATE_PER_RUN || '200' }}
        run: python -m newsdesk --state-dir state --out-dir site/data

      - name: 状態を保存
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: newsdesk-state-${{ github.run_id }}

      - name: 市場データを保存
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/data/markets.json
          key: newsdesk-markets-${{ github.run_id }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
